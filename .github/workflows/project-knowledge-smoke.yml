name: Project Knowledge Smoke

on:
  pull_request:
    paths:
      - "scripts/project_knowledge_mapper.py"
      - "tests/test_project_knowledge_mapper.py"
      - "governance/PROJECT_KNOWLEDGE_MAP_CURRENT_v0.1.yaml"
      - "artifacts/PROJECT_KEYWORD_BLOCK_MAP_v0.1.md"
      - ".github/workflows/project-knowledge-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest tests/test_project_knowledge_mapper.py
      - name: Controlled corpus mapping
        run: |
          python scripts/project_knowledge_mapper.py             README.md             artifacts/PROJECT_CHAT_CATALOGUE_v1.0.md             artifacts/DMAIC_v1.0.md             artifacts/MASTER_DOCS_v1.0.md             --json-out /tmp/project_knowledge_map.json             --md-out /tmp/project_knowledge_map.md
          test -s /tmp/project_knowledge_map.json
          test -s /tmp/project_knowledge_map.md
