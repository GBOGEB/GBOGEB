source_contract:
  canonical_input_pattern: ActiveDocs/MASTER.xlsx
  accepted_formats: [.xlsx, .xlsm]
  role: SOURCE_INPUT
  authority_transfer: false

main_runner_contract:
  entrypoint: scripts/run_processing.py
  excel_argument: --excel-input
  excel_output_root_argument: --excel-output-root
  excel_cell_mode_argument: --excel-cell-mode
  excel_tables_only_argument: --excel-tables-only
  excel_schedule_as_of_argument: --excel-schedule-as-of
  excel_due_soon_days_argument: --excel-due-soon-days
  default_without_excel: UNCHANGED_PPTX_PLUS_RECURSIVE
  requested_excel_failure: FAIL_CLOSED
  joined_receipt_schema: pipeline_automation_hub.pipeline_run_receipt.v3
  receipt_binds_excel_manifest_sha256: true
  receipt_binds_schedule_manifest_sha256: true

rendition_contract:
  table_csv:
    path: Outputs/excel/tables_csv/
    role: machine_and_llm_consumption
  table_xlsx:
    path: Outputs/excel/tables_xlsx/
    role: human_table_review
  table_manifest:
    path: Outputs/excel/table_manifest.json
    role: table_lineage_hashes_and_metadata
  human_index:
    paths:
      - Reports/schedule_index.csv
      - Reports/schedule_index.md
    role: discovery_and_review
  canonical_schedule:
    csv: Outputs/excel/schedule/canonical_schedule.csv
    xlsx: Outputs/excel/schedule/canonical_schedule.xlsx
    role: derived_canonical_schedule_projection
  validation_findings:
    path: Outputs/excel/schedule/validation_findings.csv
    role: machine_and_human_validation_evidence
  schedule_kpis:
    path: Outputs/excel/schedule/schedule_kpis.json
    role: derived_planning_metrics
  schedule_manifest:
    path: Outputs/excel/schedule/schedule_manifest.json
    role: sha256_lineage_for_schedule_projection_and_dashboard_outputs
  dashboard:
    markdown: Reports/schedule_dashboard.md
    xlsx: Reports/schedule_dashboard.xlsx
    role: human_decision_support

schedule_projection_contract:
  schema: excel_schedule_engine/schema/schedule_schema_v1.json
  implementation: excel_schedule_engine/src/schedule_projection.py
  canonical_fields:
    - activity_id
    - activity_name
    - start_date
    - finish_date
    - duration_days
    - predecessor_ids
    - owner
    - status
    - progress_pct
    - total_float_days
    - milestone
  source_lineage_fields:
    - source_table_id
    - source_sheet
    - source_row
    - activity_key
    - id_origin

validation_contract:
  ids:
    - missing_source_id_warn_and_derive
    - duplicates_within_logical_table_error
  dates:
    - invalid_date_error
    - start_after_finish_error
  duration:
    - invalid_duration_error
    - negative_duration_error
    - missing_with_dates_derives_calendar_span_info
  predecessors:
    - unknown_error
    - self_reference_error
    - cycle_error
    - resolve_within_logical_table
  owner_status:
    - missing_warn
    - unknown_status_warn
  progress:
    - parse_error
    - range_0_to_100_error
  float:
    - parse_error
    - negative_planning_red
    - zero_planning_yellow
  milestone:
    - nonzero_span_error
    - nonzero_duration_error

ryg_contract:
  red:
    - validation_error
    - active_activity_overdue
    - negative_total_float
    - status_blocked
  yellow:
    - validation_warning
    - active_activity_due_within_horizon
    - zero_total_float
    - status_on_hold
  green:
    - no_red_or_yellow_condition
  authority_effect: NONE_DERIVED_HUMAN_ATTENTION_ONLY

kpi_contract:
  - activities_total
  - green_yellow_red_counts
  - validation_pass_rate_pct
  - field_completeness_pct
  - overdue_count
  - milestone_count
  - negative_float_count
  - zero_float_count
  - mean_progress_pct
  - canonical_status_counts

keb:
  prime: EXCEL_SCHEDULE_ENGINE
  children:
    - DISCOVER_WORKBOOK_TABLES
    - EXPORT_TABLE_CSV
    - EXPORT_TABLE_XLSX
    - CLASSIFY_SCHEDULE_CANDIDATES
    - BUILD_TABLE_MANIFEST
    - BUILD_HUMAN_SCHEDULE_INDEX
    - BIND_MAIN_RUNNER_RECEIPT
    - MAP_CANONICAL_SCHEDULE_SCHEMA
    - VALIDATE_SCHEDULE_SEMANTICS
    - BUILD_SCHEDULE_PROJECTION
    - CALCULATE_PLANNING_KPIS
    - BUILD_RYG_DASHBOARD
    - BIND_SCHEDULE_MANIFEST

external_surfaces:
