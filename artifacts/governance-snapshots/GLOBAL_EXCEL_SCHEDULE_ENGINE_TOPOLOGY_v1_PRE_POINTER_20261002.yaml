  dashboard_markdown_and_xlsx_required: true
  test_failures_allowed: 0
  unknown_schedule_semantics_requires_human_review: true
  formula_relocation_must_preserve_semantics: true
  normalized_export_name_overwrite_forbidden: true
  used_range_origin_must_match_source: true
  main_runner_default_behavior_must_remain_backward_compatible: true
  requested_excel_phase_must_fail_closed: true
  schedule_validation_errors_do_not_mutate_source: true
  dashboard_ryg_cannot_create_source_truth: true
  pipeline_receipt_v3_must_bind_schedule_manifest: true

