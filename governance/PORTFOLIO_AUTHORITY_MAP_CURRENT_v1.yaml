  - path: governance/GLOBAL_MATH_PLOTS_WAVES_N_PLUS_2_v1.yaml
    canonical:
      orchestration_repo: GBOGEB/pipeline-automation-hub
      runtime_repo: GBOGEB/gg_MATH
    disposition: POINTER_IN_PLACE_ARCHIVED

reference_census:
  path: governance/BRIDGE_REFERENCE_CENSUS_20261002_v1.yaml
  state: COMPLETE
  pointer_in_place_safe: true
  destructive_rename_or_delete_safe: false
  archive_root: artifacts/governance-snapshots/

storage_rules:
  create_local_top7_top14_top21_directories: false
  copy_triage_authority_here: false
  destructive_move_without_reference_census: false
  historical_material_root: artifacts/
  future_global_status_updates:
    rule: UPDATE_CANONICAL_OWNER_FIRST
    profile_action: POINTER_OR_COMPATIBILITY_SNAPSHOT_ONLY

migration_queue:
