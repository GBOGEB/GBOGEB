    state: COMPLETE
    evidence: governance/BRIDGE_REFERENCE_CENSUS_20261002_v1.yaml
  - id: P1_POINTERIZATION
    state: COMPLETE
    depends_on: P0_REFERENCE_CENSUS
  - id: P2_ARCHIVE
    state: COMPLETE
    depends_on: P1_POINTERIZATION
    archive_root: artifacts/governance-snapshots/
  - id: P3_PROFILE_GUARD
    state: GREEN
    action: >-
      Assert that README/current control surfaces do not claim engineering
      authority, local cohort authority, or volatile portfolio readiness.
    proof:
      repair_pr: 22
      repair_head: 699804f7aa1fcbded4c2b7b4fe22326f11827cf0
      smoke_run: 36996386515
      smoke_job: 110803958884
      smoke_conclusion: success
      executed_steps: 15
      closure_rebind_requires_fresh_exact_head_smoke: true
